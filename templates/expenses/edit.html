{% extends "base.html" %}

{% block title %}Edit expense — Spendly{% endblock %}

{% block content %}

<section class="page">
    <header class="page-header">
        <div>
            <p class="page-eyebrow"><a href="{{ url_for('list_expenses') }}">Expenses</a></p>
            <h1 class="page-title">Edit expense</h1>
        </div>
    </header>

    <div class="form-card">
        {% if error %}
            <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('edit_expense', expense_id=expense.id) }}">
            <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
            {% with source = 'edit', form = expense %}
                {% include "expenses/_form.html" %}
            {% endwith %}
            <div class="form-actions">
                <a class="btn-ghost" href="{{ url_for('list_expenses') }}">Cancel</a>
                <button type="submit" class="btn-primary">Save changes</button>
            </div>
        </form>
    </div>
</section>

{% endblock %}
