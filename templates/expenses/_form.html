{# Shared form partial for the add and edit expense pages. #}
{% set source = source or 'new' %}
{% set field_id = namespace(amount='amount', category='category_id', date='date', note='note') %}

<div class="form-group">
    <label for="amount">Amount (₹)</label>
    <input type="number" id="amount" name="amount"
           class="form-input" placeholder="0.00"
           min="0.01" step="0.01"
           value="{{ form.amount if form.amount is defined else '' }}"
           required autofocus>
</div>

<div class="form-group">
    <label for="category_id">Category</label>
    <select id="category_id" name="category_id" class="form-input" required>
        <option value="">Select a category</option>
        {% for cat in categories %}
            {% set selected = (form.category_id if form.category_id is defined else none) %}
            <option value="{{ cat.id }}" {% if selected and selected|int == cat.id %}selected{% endif %}>{{ cat.name }}</option>
        {% endfor %}
    </select>
</div>

<div class="form-group">
    <label for="date">Date</label>
    <input type="date" id="date" name="date"
           class="form-input"
           value="{{ form.date if form.date is defined else '' }}"
           required>
</div>

<div class="form-group">
    <label for="note">Note <span class="form-hint">(optional)</span></label>
    <input type="text" id="note" name="note"
           class="form-input" placeholder="What was this for?"
           maxlength="200"
           value="{{ form.note if form.note is defined else '' }}">
</div>
